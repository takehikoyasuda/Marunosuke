site_name: 採点侍 — SaitenSamurai (Mac版)
site_description: 普通紙マークシート＆記述式採点を、これ1本で。macOS向けフリーソフト（phys-ken/SaitenSamurai のフォーク）。
site_author: Takehiko Yasuda
site_url: https://takehikoyasuda.github.io/SaitenSamurai-mac/
repo_url: https://github.com/takehikoyasuda/SaitenSamurai-mac
repo_name: takehikoyasuda/SaitenSamurai-mac

copyright: "&copy; 2025-2026 phys-ken (original) / Takehiko Yasuda (Mac port) &mdash; GPL-3.0 License"

theme:
  name: material
  language: ja
  # ロゴ・ファビコン
  logo: images/samurai.png
  favicon: images/favicon.ico
  # カラーパレット
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え
  font:
    text: Noto Sans JP
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.tabs.link
    - toc.follow
    - search.highlight
    - search.suggest

nav:
  - ホーム: index.md
  - ダウンロード: download.md
  - はじめに:
    - クイックスタート: quickstart.md
    - 解答用紙の準備: preparation.md
    - 機能一覧: features.md
  - 使い方:
    - マーク採点: usage/mark.md
    - 記述式採点: usage/descriptive.md
    - マーク＋記述: usage/combined.md
  - サポート:
    - よくある質問: faq.md
    - 更新履歴: changelog.md
  - 開発者向け: development.md
  - 研究レポート: research.md
  - 免責事項: disclaimer.md
  - クレジット: credits.md

extra_javascript:
  - https://unpkg.com/mermaid/dist/mermaid.min.js

extra_css:
  - stylesheets/extra.css

extra:
  # Google Analytics はフォーク元 (phys-ken) のプロパティだったため削除。
  # 自前のプロパティを使う場合は provider/property を設定する。
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/takehikoyasuda
      name: takehikoyasuda on GitHub
  generator: false

plugins:
  - search:
      lang: ja

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
